name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days without database activity.
# A simple ping to the project URL is NOT enough — it must hit the database.
# This runs a lightweight REST query against the `folders` table to keep it awake.

on:
  schedule:
    # Every 2 days at 06:00 UTC (well inside the ~7-day pause window).
    - cron: '0 6 */2 * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          supabase_url="${SUPABASE_URL%/}"
          if [[ ! "$supabase_url" =~ ^https?:// ]]; then
            supabase_url="https://$supabase_url"
          fi

          # HEAD request with a count keeps it cheap (no rows returned) while
          # still touching the database. Limit to 1 row as a fallback.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$supabase_url/rest/v1/folders?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: ******")

          echo "HTTP status: $status"

          # 200 = ok, 206 = partial content (also fine for ranged queries).
          if [ "$status" != "200" ] && [ "$status" != "206" ]; then
            echo "::error::Unexpected status $status from Supabase."
            exit 1
          fi

          echo "Supabase pinged successfully — project kept alive."
